name: Update ZEISS press release RSS feed

on:
  schedule:
    # täglich um 06:13 UTC (~08:13 Uhr Sommerzeit / 07:13 Winterzeit in Berlin)
    - cron: "13 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generate feed.xml
        run: python scrape.py

      - name: Commit and push feed.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          git diff --quiet --cached || git commit -m "Update feed.xml"
          git push
